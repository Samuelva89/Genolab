# Nginx configuration for serving React SPA
# Para desarrollo local: proxy a backend en http://app:8000
# Para producción en Render: la API URL viene en variable de entorno VITE_API_URL del frontend

# No se incluye mime.types ya que está incluido por defecto en nginx
# No se redefine el formato de log 'main' ya que nginx lo tiene por defecto

upstream backend_upstream {
    server backend:8000;
}

# Server block
server {
    listen       80;
    server_name  localhost;

    resolver 127.0.0.11 valid=5s; # Use Docker's internal DNS resolver

    # Set the root directory to the build output
    root   /usr/share/nginx/html;
    index  index.html;

    # Proxy para las rutas de la API al servicio backend
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend SPA - para todas las demás rutas, sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Errores
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

