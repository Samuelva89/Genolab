services:
  - type: web
    name: genolab-frontend
    env: docker
    region: oregon
    plan: starter
    branch: main
    dockerfilePath: ./frontend/Dockerfile.prod
    buildCommand: echo "Building frontend..." && cd frontend && npm ci && npm run build
    startCommand: nginx -g "daemon off;"
    healthCheckPath: /health
    envVars:
      - key: VITE_API_URL
        fromService:
          name: genolab-api  # Ajustar según el nombre real del servicio backend en Render
          type: web
          property: url
