services:
- type: web
  name: genolab-api
  env: python
  region: oregon  # Cambia a eu-west-1 si prefieres Europa
  plan: starter   # Escala según necesites (free, starter, standard, pro)
  branch: main
  numInstances: 1
  buildCommand: |
    pip install --upgrade pip && \
    pip install -r services/requirements.txt
  startCommand: |
    cd services && \
    python create_db.py && \
    python restore_data.py restore 2>/dev/null || true && \
    gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app -b 0.0.0.0:$PORT --timeout 120 --workers-per-core 1
  autoDeploy: true
  disk:  # Disco persistente para SQLite
    name: sqlite-data
    sizeGB: 1
  healthCheckPath: /api/health
  envVars:
    - key: PYTHONUNBUFFERED
      value: 1
    # Configuración de base de datos SQLite
    # Usamos un path que Render mantiene persistente entre reinicios del contenedor
    - key: SQLALCHEMY_DATABASE_URL
      value: sqlite:////var/lib/render/sqlite-data/genolab.db
    - key: DEBUG
      value: false
    - key: TESTING
      value: false
    # Variables de entorno sensibles - deben configurarse manualmente en Render
    - key: MINIO_ENDPOINT
      sync: false  # Configura esta variable manualmente en Render dashboard
    - key: MINIO_ACCESS_KEY
      sync: false  # Configura esta variable manualmente en Render dashboard
    - key: MINIO_SECRET_KEY
      sync: false  # Configura esta variable manualmente en Render dashboard
    - key: MINIO_BUCKET_NAME
      value: genolab-bucket
    # Si usas Redis para Celery (opcional en SQLite)
    - key: REDIS_URL
      sync: false  # Opcional - configura manualmente si usas Celery
    # Clave secreta para tokens JWT
    - key: SECRET_KEY
      sync: false  # Genera una clave segura para producción
    - key: ALGORITHM
      value: HS256
    - key: ACCESS_TOKEN_EXPIRE_MINUTES
      value: 30
    # Configuración de aplicación
    - key: MAX_UPLOAD_SIZE_MB
      value: 10
    - key: ALLOWED_EXTENSIONS
      value: fasta,fastq,gb,gff,fa,fq
    - key: CORS_ALLOWED_ORIGINS
      value: https://genolab-frontend.onrender.com,http://localhost:8080  # Ajusta según tu frontend