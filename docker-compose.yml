

services:
  redis:
    image: redis:7-alpine
    container_name: genolab_redis
    ports:
      - "6379:6379"
    networks:
      - genolab_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: genolab_minio
    env_file:
      - .env
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - genolab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live", "--connect-timeout", "10"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: genolab_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./services:/host_services
      - sqlite_data:/persistent_data
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - genolab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/", "--connect-timeout", "10"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
      cp -r /host_services/* /app/ 2>/dev/null || true
      rm -rf /app/data 2>/dev/null || true
      ln -s /persistent_data /app/data
      chmod +x /app/startup.sh
      /app/startup.sh
      "

  worker:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: genolab_worker
    env_file:
      - .env
    volumes:
      - ./services:/host_services # Corrected path
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy # Assuming worker needs backend for some reason, e.g., db access via main app
    networks:
      - genolab_net
    command: celery -A app.celery_worker worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genolab_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy # Frontend might need backend API
    networks:
      - genolab_net

networks:
  genolab_net:
    driver: bridge

volumes:
  minio_data:
  sqlite_data:

